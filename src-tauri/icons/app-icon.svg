<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: 824px body centred on the 1024 canvas, 185px corner radius. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a35"/>
      <stop offset="1" stop-color="#0f1116"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f39a2c"/><stop offset="1" stop-color="#f6d93a"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f9a63"/><stop offset="1" stop-color="#62e2b4"/></linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b2a8c"/><stop offset="1" stop-color="#22b6d0"/></linearGradient>
    <clipPath id="well"><rect x="164" y="318" width="696" height="542" rx="40"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <!-- Tab strip: one raised tab, its edge meeting the content well. -->
  <rect x="164" y="214" width="300" height="104" rx="32" fill="#1b1e25"/>
  <rect x="164" y="282" width="300" height="40" fill="#1b1e25"/>
  <rect x="196" y="248" width="36" height="36" rx="9" fill="#8fa1ff"/>
  <rect x="252" y="256" width="150" height="20" rx="10" fill="#4a5163"/>
  <rect x="164" y="318" width="696" height="542" rx="40" fill="#1b1e25"/>
  <!-- Three 16:9 frames fanned like dealt cards, as in the Fan transform. -->
  <g clip-path="url(#well)">
    <g transform="rotate(-12 512 600)"><rect x="262" y="470" width="360" height="203" rx="20" fill="url(#c)"/></g>
    <g transform="rotate(3 512 600)"><rect x="352" y="452" width="360" height="203" rx="20" fill="url(#b)" stroke="#1b1e25" stroke-width="10"/></g>
    <g transform="rotate(14 512 600)"><rect x="420" y="500" width="360" height="203" rx="20" fill="url(#a)" stroke="#1b1e25" stroke-width="10"/></g>
  </g>
</svg>
