[package]
name = "egui-image"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "An egui app rendered into a canvas so the page can treat it as an image"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "0.36.2", default-features = false }
# Must equal the wasm-bindgen CLI version in tools/ exactly.
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3.106", features = ["HtmlCanvasElement", "WebGl2RenderingContext"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
