[package]
name = "protocol"
description = "Messages between the trusted core and the interface process: framed, bounded and parsed strictly"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The link messages (`hyperlinks.md` section 8.1); off, they are compiled
# out and every side refuses their kinds.
[features]
default = ["links", "interaction", "phone-keyboard"]
links = ["interface-core/links"]
# Typing into a page (`interaction.md`): off, the typing messages are
# compiled out and every side refuses their kinds.
interaction = ["interface-core/interaction"]
# The phone keyboard (`interaction.md` section 9), which types as the
# interface's own keyboard does.
phone-keyboard = ["interaction", "interface-core/phone-keyboard"]
# The timed test's own instruments and settings (page-rules.md RULE-66):
# only the build `scripts/timed-test.sh` makes has them; no shipped build
# and no page can reach them.
timed-test = []

[dependencies]
# The input protocol's limits, and viewer state's algorithm, lifetime and
# reasons, which the fetcher's state messages carry (VS-119).
neoteletext-input.workspace = true
# The rule table's limits and codes, by name, for the messages that carry a
# page's rules between the processes (page-rules.md RULE-57, RULE-63). No
# table is decoded or evaluated here.
neoteletext-rules.workspace = true
interface-core.workspace = true
# The audio profile's bounds: channels, gains, fades, rates.
neoteletext-audio.workspace = true
# The standard's page and sub-page numbers (`limits`) that bound the
# messages' sub-pages (decision 112).
neoteletext-core.workspace = true
# Unicode's table of combining marks, so the bound on a run of them counts
# every script's (finding F-36, the owner's choice of 1 November 2026
# beside decision 49).
unicode-normalization.workspace = true

[dev-dependencies]
# The engine's records and the ReGIS renderer's limits, for the tests that
# hold the script link's bounds equal to the figures of the crates that own
# them; the library takes neither.
neoteletext-web.workspace = true
regis.workspace = true

[lints]
workspace = true
