[package]
name = "dock-menu"
description = "The menus of the browser on macOS: the Dock icon's, with its tabs and mute or unmute all, and the menu bar; and the Dock's icon outside a bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The same Objective-C bindings, at the same versions and with the same
# features, as winit uses (decision 39): no crate is added to the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.5.3"
objc2-foundation = { version = "=0.2.2", features = ["NSBundle", "NSData", "NSDictionary", "NSObject", "NSString", "NSThread"] }
objc2-app-kit = { version = "=0.2.2", features = ["NSApplication", "NSCell", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSResponder"] }

# The workspace's lints, except that unsafe code is denied rather than
# forbidden: this is the one crate allowed it, at each site with its
# reason (decision 39, requirement 10.12).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
