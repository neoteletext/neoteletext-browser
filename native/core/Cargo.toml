[package]
name = "neoteletext"
description = "The trusted core: starts the decoder and the interface process, checks every frame, encodes page images and decides what the trusted strip shows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Deciding and following links (`hyperlinks.md` sections 7, 8 and 11).
[features]
default = ["links", "interaction", "phone-keyboard"]
links = ["protocol/links", "interface-core/links", "dep:web-opener"]
# Typing into a page (`interaction.md`): off, the typing messages are
# compiled out and every side refuses their kinds.
interaction = ["protocol/interaction", "interface-core/interaction", "dep:neoteletext-input", "dep:unicode-normalization"]
# The phone keyboard (`interaction.md` section 9): its process, its panel.
phone-keyboard = ["interaction", "protocol/phone-keyboard", "interface-core/phone-keyboard"]

[dependencies]
confine.workspace = true
neoteletext-input = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }
interface-core.workspace = true
protocol.workspace = true
neoteletext-core.workspace = true
# The engine's reading of a proxy's address (settings, decision 51).
neoteletext-web.workspace = true
web-opener = { workspace = true, optional = true }
ring.workspace = true
keyring.workspace = true

# The latency test (`interaction.md` section 10) measures the decoder's
# render, this crate's encoding and the interface's decoding.
[dev-dependencies]
decoder.workspace = true

[lints]
workspace = true
