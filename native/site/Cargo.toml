[package]
name = "t42-site"
description = "A development tool, not shipped: builds a fictional 800-page channel from sample recordings, and serves it with push updates"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
decoder.workspace = true
# The terminal channel (`interaction.md`): key records, cursor records,
# sounds for its piano, the WebSocket accept value, and qrkeyboard for its
# phone page.
neoteletext-input.workspace = true
neoteletext-audio = { workspace = true, features = ["encode"] }
neoteletext-web.workspace = true
neoteletext-core.workspace = true
neoteletext-qrkeyboard.workspace = true

[lints]
workspace = true
