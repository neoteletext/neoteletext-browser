[package]
name = "neoteletext-fetcher"
description = "The fetcher process: the engine's web module opens a channel, fetches its pages in the channel's own order and holds its push connection"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Passing on the descriptor's aliases and named services (`hyperlinks.md`
# section 6.4).
[features]
default = ["links", "interaction"]
links = ["protocol/links", "dep:interface-core"]
# Typing into a page (`interaction.md`): off, the typing messages are
# compiled out and every side refuses their kinds.
interaction = ["protocol/interaction"]

[dependencies]
confine.workspace = true
# With `std`: the proxy handshake over a socket (requirement 19.10).
neoteletext-web = { workspace = true, features = ["std"] }
neoteletext-core.workspace = true
embedded-io.workspace = true
protocol.workspace = true
interface-core = { workspace = true, optional = true }
rustls.workspace = true
webpki-roots.workspace = true

[lints]
workspace = true
