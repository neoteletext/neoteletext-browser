[package]
name = "neoteletext-fetcher"
description = "The fetcher process: the engine's web module opens a channel, fetches its pages in the channel's own order and holds its push connection"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "fetcher"
path = "src/lib.rs"

# Passing on the descriptor's aliases and named services (`hyperlinks.md`
# section 6.4).
[features]
default = ["links", "interaction"]
links = ["protocol/links", "dep:interface-core"]
# Typing into a page (`interaction.md`): off, the typing messages are
# compiled out and every side refuses their kinds.
interaction = ["protocol/interaction"]

[dependencies]
confine.workspace = true
# With `std`: the proxy handshake over a socket (requirement 19.10).
neoteletext-web = { workspace = true, features = ["std"] }
neoteletext-core.workspace = true
# The level of a channel's log line from a LOG record.
neoteletext-formats.workspace = true
embedded-io.workspace = true
protocol.workspace = true
# The contacts and the longest move the protocol lets the trusted core tag,
# asserted to fit the web agent's slots (REQ-RCH-035); and viewer state's
# answers, written as the input protocol's events (VS-204).
neoteletext-input.workspace = true
interface-core = { workspace = true, optional = true }
rustls.workspace = true
# Each WebSocket frame's mask from the system's cryptographic random
# source (RFC 6455 section 5.3, TODO-6472); approved by name (DEC-6478).
ring.workspace = true
# The reader thread, the TLS pump and the handshake, shared with the
# engine's own clients.
neoteletext-transport.workspace = true
# The general web client (`src/web`, neoteletext-common's DEC-7260): its
# runtime, HTTP/1.1 and HTTP/2, TLS on a tokio socket, URLs, cookies and
# content codings.
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "io-util", "macros"] }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
tokio-rustls.workspace = true
url.workspace = true
cookie.workspace = true
cookie_store.workspace = true
publicsuffix.workspace = true
flate2.workspace = true
brotli-decompressor.workspace = true

[dev-dependencies]
# The web client's tests play its servers with hyper's own.
hyper = { workspace = true, features = ["server"] }
# A rule's report, written as the engine writes it, for the tests of what
# the fetcher sends on (page-rules.md RULE-46).
neoteletext-rules.workspace = true

[lints]
workspace = true
