# cargo-deny policy, run by scripts/check.sh full. Every dependency is
# permissively licensed (design section 8), as the teletext engine's policy
# (~/devel/neoteletext-renderer-teletext/deny.toml).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # zvariant, zvariant_derive and zbus_names were merged into zbus 6.0 on
    # 16 October 2026 and are no longer published apart: not a fault. They
    # come only from zbus 5, under two clients on Linux: the Secret Service
    # client that keeps the cookie file's key (keyring's zbus store,
    # secret-service) and the file chooser's desktop portal (ashpd). Neither
    # has a release on zbus 6 (crates.io, 3 November 2026: secret-service
    # 5.2.0, zbus-secret-service-keyring-store 1.0.1 and ashpd 0.13.13 all
    # require zbus 5). Remove these three when both have moved.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; the Linux Secret Service and portal clients are not on zbus 6 yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; the Linux Secret Service and portal clients are not on zbus 6 yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; the Linux Secret Service and portal clients are not on zbus 6 yet" },
]

[licenses]
version = 2
# Permissive licences only; never GPL. Unicode-3.0 (OSI approved,
# permissive) is the licence of ICU4X's segmentation and normalisation
# data, which parley and winit use for text: 23 crates.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Zlib", "ISC", "CC0-1.0", "Unicode-3.0"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# Mozilla's root certificate list, which the fetcher's and the phone
# keyboard's TLS trust, as the engine's policy allows it.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# The clipboard's Windows crates, through arboard (decision 49,
# docs/licensing.md section 2): the Boost Software License, permissive.
[[licenses.exceptions]]
crate = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
crate = "error-code"
allow = ["BSL-1.0"]

# The workspace's own crates are never published.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates refer to each other by path and are never
# published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The teletext engine, pinned to one commit of its local repository (the
# workspace's Cargo.toml).
allow-git = ["https://github.com/neoteletext/neoteletext-engine", "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext"]
