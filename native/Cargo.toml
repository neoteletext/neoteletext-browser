# NeoTeletext's native interface (docs/native-interface-design.md): an
# interface core that draws only through its own drawing interface, the
# drawing back ends, the interface process and the trusted core.
[workspace]
resolver = "3"
members = ["interface-core", "draw-raster", "draw-embedded", "protocol", "interface", "presenter", "core", "decoder", "fetcher", "site", "dock-menu", "web-opener", "keyboard", "confine", "sound", "sound-output", "update", "release-identity", "launcher", "os-install", "stub", "installer", "icon", "chooser", "dbus", "secret-store", "dialog", "script"]
# Built with a nightly compiler of its own (scripts/tools.sh).
exclude = ["fuzz", "tuf"]

[workspace.package]
license = "MIT"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

# Every dependency is permissively licensed (design section 8).
# The workspace's own crates take no default features from each other:
# each crate's `links` feature (on by default) turns on its dependencies'
# own, so `--no-default-features` builds the browser with hyperlinks
# compiled out (`hyperlinks.md`).
[workspace.dependencies]
interface-core = { path = "interface-core", default-features = false }
draw-raster = { path = "draw-raster", default-features = false }
draw-embedded = { path = "draw-embedded", default-features = false }
protocol = { path = "protocol", default-features = false }
dock-menu = { path = "dock-menu", default-features = false }
web-opener = { path = "web-opener", default-features = false }
# The processes' sandboxes on every platform (decision 52).
confine = { path = "confine", default-features = false }
# The browser's own D-Bus client (DEC-7168): the Linux desktop portal for
# the chooser and the Secret Service for the broker.
dbus = { path = "dbus", package = "neoteletext-dbus" }
# The viewer key file's sealing key in the platform's secret store, the
# keychain, Credential Manager or the Secret Service (VS-108), read by the
# broker alone: the browser's own calls (DEC-7168).
secret-store = { path = "secret-store", package = "neoteletext-secret-store" }
# The system's file dialogs on macOS and Windows, for the chooser: the
# browser's own calls (DEC-7168).
dialog = { path = "dialog", package = "neoteletext-dialog" }
# What the launcher, the updater, the installer and the release tool
# share (installation-and-updates.md).
update = { path = "update" }
# The release's identity, built in (installation-and-updates.md section 14).
release-identity = { path = "release-identity" }
# The calls installing and launching need that only an unsafe interface
# offers (requirement 10.12, as amended for it).
os-install = { path = "os-install" }
# The browser's icon, made from the owner's art by build scripts and the
# release tool (decision 124).
icon = { path = "icon", package = "neoteletext-icon" }
# The launcher's logic, for the Windows installer.
launcher = { path = "launcher", package = "neoteletext-launcher" }
decoder = { path = "decoder", package = "neoteletext-decoder", default-features = false }
# The teletext engine, maintained in its own repository (design section
# 4.0), pinned to one commit: of its public repository, or of the local one
# while the commit is unpublished, as the head of its branch `painting` is
# (DEVELOPMENT.md section 11; DEC-7031). Cargo reads the commit, never the
# engine's working tree.
# With no features, the core is the standard's numbers (`limits`) and the
# packet types alone, which the interface core and the protocol take
# (decision 112); the decoder names the profile it renders with.
neoteletext-core = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "54d796b96668458fc2aeffaf4d5cb651b293ecd5", default-features = false }
neoteletext-formats = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "54d796b96668458fc2aeffaf4d5cb651b293ecd5", default-features = false, features = ["tti", "alloc"] }
# The engine's web module: HTTP, channels, contents files and push, with no
# network input or output of its own.
neoteletext-web = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "54d796b96668458fc2aeffaf4d5cb651b293ecd5", default-features = false, features = ["push"] }
# The engine's network port is these traits (its decision E.38); the
# version the engine uses.
embedded-io = { version = "=0.7.1", default-features = false }
neoteletext-image = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "54d796b96668458fc2aeffaf4d5cb651b293ecd5", features = ["std"] }
# The engine's audio profile (its area AUD): the receiver, and the mixer the
# interface plays through. Opus alone of its codecs (the engine's decision
# E.131): PCM16 (`pcm16`) and IMA ADPCM (`ima`) are compiled out of the
# desktop builds (Windows, macOS, Linux) by the owner's instruction of 28
# October 2026, and kept in the engine for microcontroller ports. Only the
# reference channel and the decoder's tests write sounds (`encode`, which
# brings `ima` with it); neither is shipped, and `scripts/check.sh` proves
# the shipped programs build without either codec (decision 121).
# The profile's instruments, synth6581 and synth7 and the analogue
# synthesizers, are built into the decoder alone (the features
# `decoder/Cargo.toml` names):
# the trusted core links only the engine crates DEC-2355 permits, and the
# instruments' crate is not one of them (REQ-6415; the engine's DEC-6410).
neoteletext-audio = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "54d796b96668458fc2aeffaf4d5cb651b293ecd5", default-features = false, features = ["idl", "opus"] }
# The engine's qrkeyboard client (its decision E.93): the phone keyboard
# process's pairing and encryption, and the terminal channel's phone page.
neoteletext-qrkeyboard = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "54d796b96668458fc2aeffaf4d5cb651b293ecd5" }
# The engine's client sockets, shared with its own programs: the reader
# thread, the TLS pump and the handshake (its DEC-1905).
neoteletext-transport = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "54d796b96668458fc2aeffaf4d5cb651b293ecd5" }
# The engine's input profile (its area INT): key records and the cursor
# record (`interaction.md`).
neoteletext-input = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "54d796b96668458fc2aeffaf4d5cb651b293ecd5", default-features = false }
# The page rule table (neoteletext-common's page-rules.md, the engine's
# RULE-56): decoded and evaluated by the decoder alone (RULE-58); the
# protocol crate takes its limits by name.
neoteletext-rules = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "54d796b96668458fc2aeffaf4d5cb651b293ecd5" }
# The instruments' own interfaces (the engine's DEC-6453), for the decoder's
# tests alone, which write a synthesizer's patch as a channel's server does;
# the receiver brings the crate itself, with only the families the decoder
# names.
neoteletext-audio-instruments = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "54d796b96668458fc2aeffaf4d5cb651b293ecd5", default-features = false }
neoteletext-audio-mix = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "54d796b96668458fc2aeffaf4d5cb651b293ecd5" }
# The engine's picture converter (its DEC-2325): a picture file's bytes to a
# teletext page, run only in a decoder started to convert one picture
# (the Tools menu, docs/picture-tools.md). It brings the image crate's five
# decoders, approved by the engine's DEC-2142.
neoteletext-picture = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-teletext", rev = "54d796b96668458fc2aeffaf4d5cb651b293ecd5" }
# The ReGIS renderer, maintained in its own repository and pinned to one
# commit as the engine is (its DEC-6270; DEC-6335): DEC's vector graphics
# language with the numbered drawings of ReGIS v2, drawn by the decoder for
# the sub-pages a channel sends REGIS records for. MIT; no dependencies.
regis = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-regis", rev = "5cab7d74219f3d6def0d04a929565dcb91356c8b" }
# The VT340's characters as text, which the confined decoder cannot read
# from a file.
regis-fonts = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-regis", rev = "5cab7d74219f3d6def0d04a929565dcb91356c8b" }
# MIT (the owner's own): the NAPLPS renderer, which the decoder draws a
# channel's NAPLPS pages with, and its font (DEC-6407).
naplps = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-naplps", rev = "60e8816088bb9e1eec21caab7dff23bb6945bbf9" }
naplps-fonts = { git = "file:///Users/andrewstuart/devel/neoteletext-renderer-naplps", rev = "60e8816088bb9e1eec21caab7dff23bb6945bbf9" }
# The sound helper's own output stream to the system's device (DEC-7168,
# replacing cpal).
sound-output = { path = "sound-output" }
# MIT or Apache-2.0: sine, cosine and rounding without the standard library.
libm = "=0.2.16"
parley = "=0.12.0"
# MIT or Apache-2.0, pure Rust: the glyph outlines and their hinting the
# drawing back end fills, from the fonts Parley chose (DEC-7168, under the
# standing approval of pure-Rust libraries, DEC-6579). The version Parley
# itself reads fonts with, so it adds no crate.
skrifa = { version = "=0.44.0", default-features = false, features = ["std", "autohint_shaping"] }
# Parley's font finder, named only to load fontconfig at run time on Linux,
# so the interface starts on a machine without it and draws with its own
# fonts (installation-and-updates.md section 4.3). The same version as
# Parley's.
fontique = { version = "=0.12.0", default-features = false, features = ["fontconfig-dlopen"] }
# Without its "wayland-csd-adwaita" default feature: on Linux the window
# asks for no system decorations (interface/src/window.rs), so winit's
# Adwaita title bar, and the unmaintained ttf-parser under it
# (RUSTSEC-2026-0192), was compiled in and never drawn (DEC-2339). The
# other defaults are kept as they were.
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
# The interface's own presenting of its drawn pixels to the window, on
# each platform's own path (DEC-7168, replacing softbuffer).
presenter = { path = "presenter" }
# MIT or Apache-2.0, with no default features, so no standard library.
embedded-graphics = { version = "=0.8.2", default-features = false }
# Transport Layer Security for the fetcher and the phone keyboard (decision
# 41: `rustls`), with ring's cryptography.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Apache-2.0 AND ISC, already under rustls, approved by name for viewer
# state (DEC-6478): the trusted core's Ed25519 viewer keys and their
# signatures, the viewer key file's authenticated cipher and its nonces
# (neoteletext-common's `docs/viewer-state.md` VS-101, VS-108), and the
# fetcher's WebSocket masks from the system's random source (TODO-6472,
# RFC 6455 section 5.3).
ring = { version = "=0.17.14", default-features = false }
# The fetcher's general web client (neoteletext-common's DEC-7260 items 6
# to 8, adopted by DEC-7262), pure Rust and so under the standing approval
# of pure-Rust libraries (DEC-6579); the versions the NeoTeletext server
# pins where it has them. No program links libcurl (DEC-7253).
# MIT: the single-threaded runtime the web client's connections run on,
# inside the fetcher process alone.
tokio = { version = "=1.54.1", default-features = false }
# MIT: HTTP/1.1, and HTTP/2 through the hyper project's `h2` (MIT).
hyper = { version = "=1.12.0", default-features = false }
# MIT or Apache-2.0: rustls on a tokio socket; rustls's features are chosen
# above.
tokio-rustls = { version = "=0.26.6", default-features = false }
# MIT or Apache-2.0: the URL Standard's parser (DEC-7260 item 5); its
# Unicode tables are under Unicode-3.0, which the owner accepted (DEC-7261).
url = { version = "=2.5.9", default-features = false, features = ["std"] }
# MIT or Apache-2.0: the Set-Cookie and Cookie headers and the jar
# (DEC-7260 item 8).
cookie = { version = "=0.18.2", default-features = false }
cookie_store = { version = "=0.22.1", default-features = false }
# MIT or Apache-2.0: the public suffix list's reader, for the jars' rule
# that no cookie is set for a public suffix and for what a site is. The
# list itself is data given to it, not part of the crate.
publicsuffix = { version = "=2.3.0", default-features = false, features = ["idna"] }
# MIT or Apache-2.0: gzip and deflate response bodies, inflated by
# miniz_oxide in Rust, never a C zlib.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# BSD-3-Clause or MIT: brotli response bodies, read in Rust, without its
# `unsafe` feature.
brotli-decompressor = { version = "=6.3.2", default-features = false, features = ["std"] }
# MIT, Zlib or Apache-2.0: the release files' DEFLATE, read with a bound
# on what it writes (installation-and-updates.md section 6). The PNG
# reader that brought it into the browser left with decision 61.
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
# Apache-2.0 WITH LLVM-exception, Apache-2.0 or MIT, already under winit
# and softbuffer: the atomic exchange of two folders (`renameatx_np` with
# `RENAME_SWAP`, `renameat2` with `RENAME_EXCHANGE`, requirement 13.7)
# through a safe interface.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs"] }
# MIT or Apache-2.0: typed text sent in Unicode Normalization Form C
# (DOC-1937, REQ-INT-116; decision 49), and which
# characters are combining marks (finding F-36).
unicode-normalization = "=0.1.25"
# MIT or Apache-2.0: the system clipboard's text, for a paste into a page
# that takes input (REQ-INT-136; decision 49): AppKit's pasteboard on
# macOS, the Win32 clipboard (clipboard-win, BSL-1.0) on Windows, X11 on
# Linux. Without default features, so no image support.
arboard = { version = "=3.6.1", default-features = false }

# Warnings are errors in every gate (scripts/check.sh).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every exception says why, at the site.
allow_attributes_without_reason = "warn"
# Debugging leftovers and unfinished code never reach a commit.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true

# The Windows stub is never replaced, and is to stay under 200 KB
# (installation-and-updates.md section 4.2): built for size.
[profile.release.package.neoteletext-stub]
opt-level = "z"
codegen-units = 1
