# T42 Browser's native interface (docs/native-interface-design.md): an
# interface core that draws only through its own drawing interface, the
# drawing back ends, the interface process and the trusted core.
[workspace]
resolver = "3"
members = ["interface-core", "draw-vello", "draw-embedded", "protocol", "interface", "core", "decoder", "fetcher", "site", "dock-menu", "web-opener", "keyboard"]
# Built with a nightly compiler of its own (scripts/tools.sh).
exclude = ["fuzz"]

[workspace.package]
license = "MIT"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Every dependency is permissively licensed (design section 8).
# The workspace's own crates take no default features from each other:
# each crate's `links` feature (on by default) turns on its dependencies'
# own, so `--no-default-features` builds the browser with hyperlinks
# compiled out (`hyperlinks.md`).
[workspace.dependencies]
interface-core = { path = "interface-core", default-features = false }
draw-vello = { path = "draw-vello", default-features = false }
draw-embedded = { path = "draw-embedded", default-features = false }
protocol = { path = "protocol", default-features = false }
dock-menu = { path = "dock-menu", default-features = false }
web-opener = { path = "web-opener", default-features = false }
decoder = { path = "decoder", package = "t42-decoder", default-features = false }
# The teletext engine, maintained in its own repository (design section
# 4.0), pinned to one commit. Its repository is local until that commit is
# published; Cargo reads the commit, never the engine's working tree. The
# engine's recommended "modern-classic" profile (its decision E.71).
neoteletext-core = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "88d09b11eb6ed5ecb421526d3370c5ec57d786e2", default-features = false, features = ["modern-classic"] }
neoteletext-formats = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "88d09b11eb6ed5ecb421526d3370c5ec57d786e2", default-features = false, features = ["tti", "transport", "sliced"] }
# The engine's web module: HTTP, channels, contents files and push, with no
# network input or output of its own.
neoteletext-web = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "88d09b11eb6ed5ecb421526d3370c5ec57d786e2", default-features = false, features = ["push"] }
# The engine's network port is these traits (its decision E.38); the
# version the engine uses.
embedded-io = { version = "=0.7.1", default-features = false }
neoteletext-image = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "88d09b11eb6ed5ecb421526d3370c5ec57d786e2", features = ["std"] }
# The engine's audio profile (its area AUD): the receiver, and the mixer the
# interface plays through.
neoteletext-audio = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "88d09b11eb6ed5ecb421526d3370c5ec57d786e2", default-features = false, features = ["idl", "ima"] }
# The engine's qrkeyboard client (its decision E.93): the phone keyboard
# process's pairing and encryption, and the terminal channel's phone page.
neoteletext-qrkeyboard = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "88d09b11eb6ed5ecb421526d3370c5ec57d786e2" }
# The engine's input profile (its area INT): key records and the cursor
# record (`interaction.md`).
neoteletext-input = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "88d09b11eb6ed5ecb421526d3370c5ec57d786e2", default-features = false }
neoteletext-audio-mix = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "88d09b11eb6ed5ecb421526d3370c5ec57d786e2" }
# Apache-2.0: the operating systems' audio output (Core Audio on macOS),
# without unsafe code of ours (decision 37).
cpal = "=0.18.2"
# MIT or Apache-2.0: sine, cosine and rounding without the standard library.
libm = "=0.2.16"
# Single-threaded: with its "multithreading" feature, vello_cpu 0.3.0's
# worker threads kept a whole core busy while the window was idle
# (prototypes/spikes/vello-wall).
vello_cpu = { version = "=0.3.0", default-features = false, features = ["std", "text", "u8_pipeline"] }
parley = "=0.12.0"
winit = "=0.30.13"
# The same Linux displays as winit's default features, loaded at run time
# as winit loads them; without a backend softbuffer does not build on
# Linux. Its kms backend draws to the console with no window, which winit
# cannot drive.
softbuffer = { version = "=0.4.8", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "x11-dlopen"] }
# MIT or Apache-2.0, with no default features, so no standard library.
embedded-graphics = { version = "=0.8.2", default-features = false }
# MIT or Apache-2.0: reads the indexed images the trusted core writes (design section 6).
png = "=0.18.1"
# Transport Layer Security for the fetcher and the phone keyboard (decision
# 41: `rustls`), with ring's cryptography and Mozilla's root certificates,
# the versions and features the engine's own fetcher uses.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"

# Warnings are errors in every gate (scripts/check.sh).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every exception says why, at the site.
allow_attributes_without_reason = "warn"
# Debugging leftovers and unfinished code never reach a commit.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
