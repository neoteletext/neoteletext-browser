# NeoTeletext's native interface (docs/native-interface-design.md): an
# interface core that draws only through its own drawing interface, the
# drawing back ends, the interface process and the trusted core.
[workspace]
resolver = "3"
members = ["interface-core", "draw-vello", "draw-embedded", "protocol", "interface", "core", "decoder", "fetcher", "site", "dock-menu", "web-opener", "keyboard", "confine", "sound", "update", "release-identity", "launcher", "os-install", "stub", "installer"]
# Built with a nightly compiler of its own (scripts/tools.sh).
exclude = ["fuzz", "tuf"]

[workspace.package]
license = "MIT"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Every dependency is permissively licensed (design section 8).
# The workspace's own crates take no default features from each other:
# each crate's `links` feature (on by default) turns on its dependencies'
# own, so `--no-default-features` builds the browser with hyperlinks
# compiled out (`hyperlinks.md`).
[workspace.dependencies]
interface-core = { path = "interface-core", default-features = false }
draw-vello = { path = "draw-vello", default-features = false }
draw-embedded = { path = "draw-embedded", default-features = false }
protocol = { path = "protocol", default-features = false }
dock-menu = { path = "dock-menu", default-features = false }
web-opener = { path = "web-opener", default-features = false }
# The processes' sandboxes on every platform (decision 52).
confine = { path = "confine", default-features = false }
# What the launcher, the updater, the installer and the release tool
# share (installation-and-updates.md).
update = { path = "update" }
# The release's identity, built in (installation-and-updates.md section 14).
release-identity = { path = "release-identity" }
# The calls installing and launching need that only an unsafe interface
# offers (requirement 10.12, as amended for it).
os-install = { path = "os-install" }
# The launcher's logic, for the Windows installer.
launcher = { path = "launcher", package = "neoteletext-launcher" }
decoder = { path = "decoder", package = "neoteletext-decoder", default-features = false }
# The teletext engine, maintained in its own repository (design section
# 4.0), pinned to one commit. Its repository is local until that commit is
# published; Cargo reads the commit, never the engine's working tree. The
# engine's "modern-classic" profile (its decision E.71) with the Colour
# Map of Levels 2.5 and 3.5, which that profile leaves out: decision 6 is
# 32 colours, and decision 60 restores them.
neoteletext-core = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "d9ca77f8aef30fff162e6727282f2a583798e03e", default-features = false, features = ["modern-classic", "level35-32colors"] }
neoteletext-formats = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "d9ca77f8aef30fff162e6727282f2a583798e03e", default-features = false, features = ["tti", "transport", "sliced"] }
# The engine's web module: HTTP, channels, contents files and push, with no
# network input or output of its own.
neoteletext-web = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "d9ca77f8aef30fff162e6727282f2a583798e03e", default-features = false, features = ["push", "cookies"] }
# The engine's network port is these traits (its decision E.38); the
# version the engine uses.
embedded-io = { version = "=0.7.1", default-features = false }
neoteletext-image = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "d9ca77f8aef30fff162e6727282f2a583798e03e", features = ["std"] }
# The engine's audio profile (its area AUD): the receiver, and the mixer the
# interface plays through.
neoteletext-audio = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "d9ca77f8aef30fff162e6727282f2a583798e03e", default-features = false, features = ["idl", "ima"] }
# The engine's qrkeyboard client (its decision E.93): the phone keyboard
# process's pairing and encryption, and the terminal channel's phone page.
neoteletext-qrkeyboard = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "d9ca77f8aef30fff162e6727282f2a583798e03e" }
# The engine's input profile (its area INT): key records and the cursor
# record (`interaction.md`).
neoteletext-input = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "d9ca77f8aef30fff162e6727282f2a583798e03e", default-features = false }
neoteletext-audio-mix = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "d9ca77f8aef30fff162e6727282f2a583798e03e" }
# Apache-2.0: the operating systems' audio output (Core Audio on macOS),
# without unsafe code of ours (decision 37).
cpal = "=0.18.2"
# MIT or Apache-2.0: sine, cosine and rounding without the standard library.
libm = "=0.2.16"
# Single-threaded: with its "multithreading" feature, vello_cpu 0.3.0's
# worker threads kept a whole core busy while the window was idle
# (prototypes/spikes/vello-wall, at the tag prototypes-final).
vello_cpu = { version = "=0.3.0", default-features = false, features = ["std", "text", "u8_pipeline"] }
parley = "=0.12.0"
# Parley's font finder, named only to load fontconfig at run time on Linux,
# so the interface starts on a machine without it and draws with its own
# fonts (installation-and-updates.md section 4.3). The same version as
# Parley's.
fontique = { version = "=0.12.0", default-features = false, features = ["fontconfig-dlopen"] }
winit = "=0.30.13"
# The same Linux displays as winit's default features, loaded at run time
# as winit loads them; without a backend softbuffer does not build on
# Linux. Its kms backend draws to the console with no window, which winit
# cannot drive.
softbuffer = { version = "=0.4.8", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "x11-dlopen"] }
# MIT or Apache-2.0, with no default features, so no standard library.
embedded-graphics = { version = "=0.8.2", default-features = false }
# Transport Layer Security for the fetcher and the phone keyboard (decision
# 41: `rustls`), with ring's cryptography and Mozilla's root certificates,
# the versions and features the engine's own fetcher uses.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Apache-2.0 AND ISC, already under rustls: the cookie file's authenticated
# cipher and its nonces (`cookies.md` section 7, decision 62).
ring = { version = "=0.17.14", default-features = false }
# MIT or Apache-2.0: the key of the cookie file kept in the platform's
# secret store, the Keychain, Credential Manager or the Secret Service
# (`cookies.md` section 7, decision 62), read by the broker alone.
keyring = { version = "=4.2.0" }
webpki-roots = "=1.0.10"
# MIT, Zlib or Apache-2.0: the release files' DEFLATE, read with a bound
# on what it writes (installation-and-updates.md section 6). The PNG
# reader that brought it into the browser left with decision 61.
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
# Apache-2.0 WITH LLVM-exception, Apache-2.0 or MIT, already under winit
# and tempfile: the atomic exchange of two folders (`renameatx_np` with
# `RENAME_SWAP`, `renameat2` with `RENAME_EXCHANGE`, requirement 13.7)
# through a safe interface.
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }
# MIT or Apache-2.0: typed text sent in Unicode Normalization Form C
# (INPUT.md section 5.7 rule 3, REQ-INT-116; decision 49).
unicode-normalization = "=0.1.25"
# MIT or Apache-2.0: the system clipboard's text, for a paste into a page
# that takes input (REQ-INT-136; decision 49): AppKit's pasteboard on
# macOS, the Win32 clipboard (clipboard-win, BSL-1.0) on Windows, X11 on
# Linux. Without default features, so no image support.
arboard = { version = "=3.6.1", default-features = false }

# Warnings are errors in every gate (scripts/check.sh).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every exception says why, at the site.
allow_attributes_without_reason = "warn"
# Debugging leftovers and unfinished code never reach a commit.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true

# The Windows stub is never replaced, and is to stay under 200 KB
# (installation-and-updates.md section 4.2): built for size.
[profile.release.package.neoteletext-stub]
opt-level = "z"
codegen-units = 1
