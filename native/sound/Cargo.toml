[package]
name = "neoteletext-sound"
description = "The sound helper (decision 55): plays the voice operations the trusted core checked, through the system's sound output, and nothing else"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "sound"
path = "src/lib.rs"

[[bin]]
name = "neoteletext-sound"
path = "src/main.rs"

[features]
# The timed test's marks and its setting "the device buffer left at 480
# frames" (page-rules.md RULE-66), only in the build
# `scripts/timed-test.sh` makes.
timed-test = ["protocol/timed-test", "confine/timed-test"]

[dependencies]
confine.workspace = true
protocol.workspace = true
neoteletext-audio-mix.workspace = true
# The audio profile's bounds alone: its number of audio channels names the
# streams a channel's decoder may hold (`audio/names.rs`).
neoteletext-audio.workspace = true
# The instruments of a page's local sounds, rendered here just in time
# (neoteletext-common's page-rules.md RULE-62, DEC-6525 item 12): every
# family that plays notes. They are integer-only, never allocate and hold
# no unsafe code.
neoteletext-audio-instruments = { workspace = true, features = ["synth7", "synth106", "synthd", "synth53", "synth8", "synth80"] }
# The rule table's codes for a watch list's slots (RULE-33), by name.
neoteletext-rules.workspace = true
# The operating system's audio output, our own stream (DEC-7168): an
# output audio unit on macOS, WASAPI on Windows, and on Linux the system's
# ALSA library, libasound, linked dynamically; the owner accepted its LGPL
# licence (decision 40). Only this helper links it, so a Linux without it
# runs silent (decision 55).
sound-output.workspace = true

[lints]
workspace = true
