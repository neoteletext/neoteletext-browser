[package]
name = "interface-core"
description = "The interface's state, layout, animation and hit-testing, with no standard library and no drawing library: it draws only through the Canvas trait"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Hyperlinks drawn by the browser (`hyperlinks.md`); off, they are compiled out.
[features]
default = ["links", "interaction", "phone-keyboard"]
links = []
# Typing into a page (`interaction.md`): off, the typing messages are
# compiled out and every side refuses their kinds.
interaction = ["dep:neoteletext-input"]
# The phone keyboard's panel and strip (`interaction.md` section 9).
phone-keyboard = ["interaction"]

[dependencies]
neoteletext-input = { workspace = true, optional = true }
# The standard's page and sub-page numbers, `neoteletext_core::limits`,
# with the engine's default features off: nothing of the decoder comes
# with them (decision 112, the engine's REQ-NUM-031).
neoteletext-core.workspace = true
libm.workspace = true

[lints]
workspace = true
