[package]
name = "neoteletext-script"
description = "The script library (script-api.md, DEC-7262): a channel's JavaScript run in QuickJS compiled to WebAssembly and interpreted by wasmi, in a container with a channel context and a page context, behind one flat host call"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The interpreter's plain loop in place of its tail calls, whatever the
# build. wasmi chooses between them by the profile's optimisation level
# and debug assertions as its build script sees them; a build that turns
# debug assertions on by compiler flags alone, as the fuzz targets' does,
# is not seen, and would run tail calls that are not tail calls and nest
# on the native stack until it overflows.
portable-dispatch = ["wasmi/portable-dispatch"]

[dependencies]
# MIT or Apache-2.0, pure Rust: the WebAssembly interpreter the script
# engine's module runs in, with fuel metering and memory limits (the
# owner's DEC-7256; under the standing approval of pure-Rust libraries,
# DEC-6579). `std`, `validate` and `auto-dispatch` and nothing else: no
# text format, no 64-bit memories, no SIMD. `auto-dispatch` is wasmi's own
# default: its interpreter loop is tail calls where the build is one in
# which the compiler makes them (an optimised build without debug
# assertions) and a plain loop otherwise. Without the feature it is tail
# calls always, and in a build with debug assertions those nest on the
# native stack until it overflows.
wasmi = { version = "=2.0.2", default-features = false, features = ["std", "validate", "auto-dispatch"] }
# HKDF-SHA-256 and ChaCha20, for a context's random sources (script-api.md
# section 13 item 7; TODO-7279, TODO-7285 item 2).
ring.workspace = true
# The rule table's bounds on queued events and held keys, and the audio
# channels, by name (script-api.md section 10.6).
neoteletext-rules.workspace = true
# The engine's largest frame, which bounds one step's output, by name.
neoteletext-web.workspace = true
# The synthesizer families' codec numbers, by name (script-api.md section 3.5).
neoteletext-audio.workspace = true
# MIT, the project's own, no dependencies: the ReGIS renderer, for its
# `Validator`, which checks each step's commit before it is sent, and its
# limits by name (script-api.md sections 6.2 and 11.1).
regis.workspace = true
# The bound on the keys a page may claim, by name.
protocol.workspace = true
# MIT or Apache-2.0: the URL standard's parser and its API's setters, for
# a script's `URL` (operation 40; script-api.md section 9.1), the same
# crate at the same version the web client reads every address with, so
# that the two never read one address two ways (DEC-7260 item 5).
url.workspace = true
# (Apache-2.0 or MIT) and BSD-3-Clause, pure Rust: the Encoding standard's
# decoders, for a script's `TextDecoder` (operation 49; script-api.md
# section 9.1 names it; under the standing approval of pure-Rust
# libraries, DEC-6579). `alloc` alone: decoding to a `String`.
encoding_rs = { version = "=0.8.35", default-features = false, features = ["alloc"] }
# The NAPLPS renderer (MIT, the project's own, pinned by revision): the
# dot mapping every writer of NAPLPS calls (naplps-raster.md RAS-2) and
# the renderer's limits by name (script-api.md section 7; work package N1).
naplps.workspace = true
# The engine's own text encoders: `write_text::write_runs` for teletext
# (section 5.6, DEC-2199) and the picture text encoder for NAPLPS
# (renderer parity PAR-3 to PAR-5), text in the 55 provided sets. The
# feature `picture-text` holds `write-text`, which brings unicode-bidi
# 0.3.18 (MIT or Apache-2.0, pure Rust; the engine's decision E.82, rdm
# DEC-606; under the owner's standing approval DEC-6579), for
# right-to-left runs.
neoteletext-formats = { workspace = true, features = ["write-text", "picture-text"] }
# The teletext API (script-api.md section 5, work package T1): the engine
# core's constants, character set designations and control limits, by
# name. And the engine's character sets, which the picture text encoder
# names: its feature `picture-text` uses the core's `glyphs` module
# without turning on the core's `render` feature that holds it (the
# engine's TODO-7363, after which the feature goes from this line).
neoteletext-core = { workspace = true, features = ["render"] }

[dev-dependencies]
# The teletext tests' receiver (tests/teletext/receiver.rs): the engine as
# the browser's decoder builds it, so that a kept picture is what the
# browser would show.
neoteletext-core = { workspace = true, features = ["modern-classic", "level35-32colors", "extended-sets"] }
# The receiver's stroke font for the primary set, as the browser's decoder
# gives it to the NAPLPS renderer (MIT, the project's own, pinned by
# revision): the tests draw what the painter writes.
naplps-fonts.workspace = true

[lints]
workspace = true
