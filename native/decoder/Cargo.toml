[package]
name = "neoteletext-decoder"
description = "The decoder process: the neoteletext engine reads a channel's bytes, stores its pages and renders the pages on screen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "decoder"
path = "src/lib.rs"

[[bin]]
name = "neoteletext-decoder"
path = "src/main.rs"

# Finding links in pages (`hyperlinks.md` section 6).
[features]
default = ["links", "interaction", "page-cache"]
links = ["protocol/links", "interface-core/links"]
# Typing into a page (`interaction.md`): off, the typing messages are
# compiled out and every side refuses their kinds.
interaction = ["protocol/interaction", "interface-core/interaction", "dep:neoteletext-input"]
# Keeping page source between selections (REQ-1558): on in the browser on
# every desktop and phone. Off, as a microcontroller receiver would be, a
# tile is drawn only from what was selected since the wall last changed.
page-cache = []

[dependencies]
confine.workspace = true
neoteletext-input = { workspace = true, optional = true }
# The audio profile's receiver (the engine's area AUD).
neoteletext-audio.workspace = true
# The engine's "modern-classic" profile (its decision E.71) with the Colour
# Map of Levels 2.5 and 3.5, which that profile leaves out: decision 6 is
# 32 colours, and decision 60 restores them. And `extended-sets`, so that a
# page in any language the engine supports shows (its DEC-1761).
neoteletext-core = { workspace = true, features = ["modern-classic", "level35-32colors", "extended-sets"] }
neoteletext-formats.workspace = true
# The reader of a live channel's LINKS records (neoteletext-common's
# REQ-1494): a pushed sub-page's Link Extension links.
neoteletext-web.workspace = true
neoteletext-image.workspace = true
interface-core.workspace = true
protocol.workspace = true

[dev-dependencies]
# Writing the audio packets the tests read.
neoteletext-audio = { workspace = true, features = ["encode"] }
# Authoring a Level 2.5 test page, and writing it as TTI.
neoteletext-formats = { workspace = true, features = ["std"] }

[lints]
workspace = true
