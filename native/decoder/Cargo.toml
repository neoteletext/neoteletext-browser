[package]
name = "neoteletext-decoder"
description = "The decoder process: the neoteletext engine reads a channel's bytes, stores its pages and renders the pages on screen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "decoder"
path = "src/lib.rs"

[[bin]]
name = "neoteletext-decoder"
path = "src/main.rs"

# Finding links in pages (`hyperlinks.md` section 6).
[features]
default = ["links", "interaction"]
links = ["protocol/links", "interface-core/links"]
# Typing into a page (`interaction.md`): off, the typing messages are
# compiled out and every side refuses their kinds.
interaction = ["protocol/interaction", "interface-core/interaction", "dep:neoteletext-input"]

[dependencies]
confine.workspace = true
neoteletext-input = { workspace = true, optional = true }
# The audio profile's receiver (the engine's area AUD).
neoteletext-audio.workspace = true
neoteletext-core.workspace = true
neoteletext-formats.workspace = true
neoteletext-image.workspace = true
interface-core.workspace = true
protocol.workspace = true

[dev-dependencies]
# Writing the audio packets the tests read.
neoteletext-audio = { workspace = true, features = ["encode"] }
# Authoring a Level 2.5 test page, and writing it as TTI.
neoteletext-formats = { workspace = true, features = ["std"] }

[lints]
workspace = true
