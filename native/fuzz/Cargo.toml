# Fuzz targets for every reader of input from outside a process, run by
# `cargo fuzz` in scripts/check.sh full. Outside the workspace: libFuzzer
# needs a nightly compiler, and the workspace builds on stable without it.
[package]
name = "t42-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
protocol = { path = "../protocol" }
interface-core = { path = "../interface-core" }
decoder = { path = "../decoder", package = "t42-decoder" }
t42-interface = { path = "../interface" }
t42-browser = { path = "../core" }
web-opener = { path = "../web-opener" }
neoteletext-qrkeyboard = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "88d09b11eb6ed5ecb421526d3370c5ec57d786e2" }
neoteletext-input = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "88d09b11eb6ed5ecb421526d3370c5ec57d786e2" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[[bin]]
name = "interface_messages"
path = "fuzz_targets/interface_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "core_messages"
path = "fuzz_targets/core_messages.rs"
test = false
