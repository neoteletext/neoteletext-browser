# Fuzz targets for every reader of input from outside a process, run by
# `cargo fuzz` in scripts/check.sh full. Outside the workspace: libFuzzer
# needs a nightly compiler, and the workspace builds on stable without it.
[package]
name = "neoteletext-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
protocol = { path = "../protocol" }
interface-core = { path = "../interface-core" }
decoder = { path = "../decoder", package = "neoteletext-decoder" }
neoteletext = { path = "../core" }
web-opener = { path = "../web-opener" }
confine = { path = "../confine" }
update = { path = "../update" }
neoteletext-qrkeyboard = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "d9ca77f8aef30fff162e6727282f2a583798e03e" }
neoteletext-input = { git = "file:///Users/andrewstuart/devel/neoteletext-engine", rev = "d9ca77f8aef30fff162e6727282f2a583798e03e" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[[bin]]
name = "interface_messages"
path = "fuzz_targets/interface_messages.rs"
test = false
doc = false
bench = false

