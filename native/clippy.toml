# Tests fail by panicking: the no-panic lints of the crates that read
# outside input apply to their code, not to their tests.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
# Words written as words in documentation, not code: the product's name,
# and the key European layouts print on their right Alt (clippy's defaults
# kept with "..").
doc-valid-idents = ["NeoTeletext", "AltGr", ".."]
