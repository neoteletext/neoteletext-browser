[package]
name = "t42-interface"
description = "The interface process: draws the window, the wall and the trusted strip, holds no secrets, has no network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
interface-core.workspace = true
draw-vello.workspace = true
protocol.workspace = true
winit.workspace = true
softbuffer.workspace = true
png.workspace = true
neoteletext-audio-mix.workspace = true
dock-menu.workspace = true

# Sound is built for macOS only for now (decision 37): on Linux cpal links
# the system's LGPL libasound, which awaits the owner (open decision D3).
[target.'cfg(target_os = "macos")'.dependencies]
cpal.workspace = true

[dev-dependencies]
decoder.workspace = true
neoteletext-image.workspace = true

[lints]
workspace = true
