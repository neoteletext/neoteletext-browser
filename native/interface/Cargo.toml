[package]
name = "neoteletext-interface"
description = "The interface process: draws the window, the wall and the trusted strip, holds no secrets, has no network"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Drawing links and asking before they leave (`hyperlinks.md` sections 9
# and 10).
[features]
default = ["links", "interaction", "phone-keyboard"]
links = ["protocol/links", "interface-core/links"]
# Typing into a page (`interaction.md`): off, the typing messages are
# compiled out and every side refuses their kinds.
interaction = ["protocol/interaction", "interface-core/interaction", "dep:neoteletext-input", "dep:arboard"]
# The phone keyboard's panel, strip and keys (`interaction.md` section 9).
phone-keyboard = ["interaction", "protocol/phone-keyboard", "interface-core/phone-keyboard"]

[dependencies]
confine.workspace = true
neoteletext-input = { workspace = true, optional = true }
arboard = { workspace = true, optional = true }
interface-core.workspace = true
draw-vello.workspace = true
protocol.workspace = true
winit.workspace = true
softbuffer.workspace = true
png.workspace = true
neoteletext-audio-mix.workspace = true
dock-menu.workspace = true
# The operating system's audio output: Core Audio on macOS, WASAPI on
# Windows, and on Linux the system's ALSA library, libasound, linked
# dynamically; the owner accepted its LGPL licence (decision 40).
cpal.workspace = true

[dev-dependencies]
decoder.workspace = true
neoteletext-image.workspace = true

[lints]
workspace = true
