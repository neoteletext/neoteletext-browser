[package]
name = "neoteletext-launcher"
description = "The launcher (installation-and-updates.md section 3): what the user starts; it chooses a version, accepts a staged one by its pinned signer, counts a trial's failed starts, rolls back, starts the broker and commits a healthy trial; and on Linux and macOS it installs and removes the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "launcher"

[[bin]]
name = "neoteletext-launcher"
path = "src/main.rs"

[dependencies]
update.workspace = true
release-identity.workspace = true
os-install.workspace = true

# Ending a trial version that hangs, with every process it started: its
# process group (section 13's "one that hangs").
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

# Windows: the uninstaller removes the helpers' AppContainer profiles.
[target.'cfg(windows)'.dependencies]
confine.workspace = true

[dev-dependencies]
ring.workspace = true

[lints]
workspace = true
