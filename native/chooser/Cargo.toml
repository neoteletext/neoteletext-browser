[package]
name = "neoteletext-chooser"
description = "The file dialog (DEC-1551 item 1): the broker starts it for one choice, it shows the system's dialog, prints the path chosen and ends, so that GUI toolkits and the shell's extensions stay out of the broker; on Linux it also reads the desktop portal's reduced-motion preference for the broker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
confine.workspace = true

# The system's dialogs with no unsafe code of this project's (DEC-1551 item
# 2): MIT. Without its Linux backends: the desktop portal is reached through
# the browser's own D-Bus client.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

# The XDG desktop portal's FileChooser, which can be parented to the browser's
# window from another process (DEC-1551 item 2), and its Settings, from which
# the desktop's reduced-motion preference is read for the broker (REQ-754),
# over the browser's own D-Bus client (DEC-7168).
[target.'cfg(target_os = "linux")'.dependencies]
dbus.workspace = true

[lints]
workspace = true
