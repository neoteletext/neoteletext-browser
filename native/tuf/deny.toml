# cargo-deny policy of the updater's workspace, run by scripts/check.sh
# full: the browser's own policy (../deny.toml), for `tough` and its
# dependencies (installation-and-updates.md section 8.2).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only; never GPL. Unicode-3.0 for the URL crate's
# internationalised names, as in the browser's own tree.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Zlib", "ISC", "CC0-1.0", "Unicode-3.0"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# Mozilla's root certificate list, which the updater's TLS trusts, as the
# fetcher's does.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# The workspace's own crates are never published.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The teletext engine, at the browser's pin.
allow-git = ["https://github.com/neoteletext/neoteletext-engine"]
