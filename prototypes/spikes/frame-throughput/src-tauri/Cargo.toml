[package]
name = "frame-throughput-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Proof C: frames from a decoder process, encoded and sent over a Tauri channel, swapped into image elements"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
standin = { path = "../../../standin" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
