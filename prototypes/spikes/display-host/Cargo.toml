[package]
name = "display-host-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false
description = "Decisions 30 to 32: the smallest form of NeoTeletext's own display host for Linux"

[dependencies.smithay]
version = "=0.7.0"
default-features = false
features = ["backend_winit", "wayland_frontend", "desktop"]

# The same version Smithay 0.7.0 uses, for the window's OpenGL surface under Wayland.
[dependencies.wayland-egl]
version = "=0.32.11"

[dependencies.accesskit]
version = "=0.25.1"

[dependencies.accesskit_unix]
version = "=0.24.0"

[lints.rust]
# Unsafe is allowed only at the sites that need it (the display's file
# descriptor source and the OpenGL set-up), each with its reason.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
