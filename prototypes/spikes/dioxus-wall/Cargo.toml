[package]
name = "dioxus-wall-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "The React prototype's tab, page wall and thumbnail size slider, in Dioxus with its native HTML and CSS renderer (Blitz), with no web engine and no JavaScript"

[dependencies]
# Dioxus 0.7, the current stable release, with the native renderer only.
dioxus = { version = "=0.7.10", default-features = false, features = ["native", "lib", "launch"] }
standin = { path = "../../standin" }
# The runtime Dioxus native already runs on; used here only for the layout
# switch's dwell timer.
tokio = { version = "=1.53.3", features = ["time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Optimise dependencies even in debug builds, so the renderer runs at a
# speed that lets the interface be judged.
[profile.dev.package."*"]
opt-level = 3
