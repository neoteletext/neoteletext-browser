[package]
name = "neoteletext"
version = "0.1.0"
description = "NeoTeletext"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
# `unstable` enables Window::add_child, which puts each tab in its own child webview.
tauri = { version = "2.12.3", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1.28", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
