[package]
name = "skia-wall-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "The React prototype's tab with no interface framework: our own layout, input and animation, drawn with tiny-skia, shown with softbuffer in a winit window"

# Every dependency is permissively licensed: tiny-skia BSD-3-Clause; winit
# Apache-2.0; softbuffer and embedded-graphics MIT or Apache-2.0.
[dependencies]
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
winit = "=0.30.13"
softbuffer = { version = "=0.4.8", default-features = false }
# Only for its bitmap fonts (from the public-domain X11 fixed fonts), the
# same text a microcontroller build would draw.
embedded-graphics = "=0.8.2"
standin = { path = "../../standin" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 3
