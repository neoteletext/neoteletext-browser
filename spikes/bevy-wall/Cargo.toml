[package]
name = "bevy-wall-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "The page wall and thumbnail size slider of the React prototype, drawn with Bevy instead of a web engine"

[dependencies]
# Only what this interface uses: a window, the user interface with its
# standard widgets and text, images made in memory, and pointer picking for
# the slider and wheel scrolling. Left out of Bevy's defaults: 3D and 2D
# rendering, audio, gamepads, scenes, animation, gizmos, high dynamic range,
# image file formats, Linux display back ends and the system information
# plugin.
bevy = { version = "=0.20.0", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_text",
    "default_font",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_ui_widgets",
    "bevy_input_focus",
    "bevy_picking",
    "ui_picking",
] }
standin = { path = "../../standin" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Bevy's own guidance: optimise dependencies even in debug builds, or the
# engine runs too slowly to judge the interface.
[profile.dev.package."*"]
opt-level = 3
